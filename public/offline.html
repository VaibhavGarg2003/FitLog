<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0C0E12">
  <title>You're offline · MyFitLog</title>
  <!--
    Served by the service worker when a page can't load because there is no
    connection. It must work with ZERO network: no external CSS, fonts,
    images or scripts. Everything is inline.
  -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0C0E12;
      color: #EFF1F5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 360px; text-align: center; }
    svg { width: 72px; height: 72px; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: #9CA3AF; font-size: 15px; }
    .note {
      margin: 20px 0 24px;
      padding: 12px 14px;
      border: 1px solid #262B35;
      border-radius: 12px;
      background: #13161C;
      text-align: left;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #22C55E;
      color: #0C0E12;
      font-size: 16px;
      font-weight: 600;
    }
    button:active { background: #16A34A; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <g transform="translate(256 256) rotate(-45) translate(-256 -256)" fill="#22C55E">
        <rect x="176" y="243" width="160" height="26" rx="8" fill="#16A34A"/>
        <rect x="144" y="176" width="32" height="160" rx="11"/>
        <rect x="336" y="176" width="32" height="160" rx="11"/>
        <rect x="108" y="206" width="30" height="100" rx="10"/>
        <rect x="374" y="206" width="30" height="100" rx="10"/>
      </g>
    </svg>
    <h1>You're offline</h1>
    <p>MyFitLog needs a connection to open this page.</p>
    <div class="note">
      <p style="margin:0">
        Logging a workout? Sets you already logged in an open workout are
        saved on this phone and will sync automatically when you're back online.
      </p>
    </div>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
